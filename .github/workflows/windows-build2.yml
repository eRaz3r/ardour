name: Build Ardour for Windows (ASIO & JACK)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}

    steps:
      # 1. Code inklusive ALLER Submodule korrekt auschecken
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      # 2. MSYS2 Umgebung aufsetzen
      - name: Setup MSYS2 & Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-python3
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pango
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-liblo
            mingw-w64-x86_64-taglib
            mingw-w64-x86_64-lrdf
            mingw-w64-x86_64-lilv
            mingw-w64-x86_64-suil
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-dlfcn
            mingw-w64-x86_64-jack2

      # 3. ASIO-SDK über ein stabiles GitHub-Repository klonen (statt curl-Download)
      - name: Clone ASIO SDK
        run: |
          git clone https://github.com /c/asiosdk
        shell: bash

      # 4. Konfigurieren
      - name: Configure Ardour
        run: |
          ./waf configure --dist-target=mingw --optimize --windows-vst --with-backends=portaudio,jack,dummy --also-include=/c/asiosdk

      # 5. Kompilieren
      - name: Compile Ardour
        run: |
          ./waf

      # 6. Bereitstellen
      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ardour-Windows-ASIO-JACK
          path: gtk2_ardour/release/
