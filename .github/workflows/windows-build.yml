name: Build Ardour for Windows (ASIO & JACK)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: msys2 {0}

    steps:
      # 1. Code auschecken
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      # 2. Cache für MSYS2-Pakete einrichten
      - name: Cache MSYS2 Packages
        uses: actions/cache@v4
        with:
          path: |
            C:\msys64\var\cache\pacman\pkg
            C:\msys64\ucrt64
          key: ${{ runner.os }}-msys2-${{ hashFiles('**/windows-build.yml') }}
          restore-keys: |
            ${{ runner.os }}-msys2-

      # 3. MSYS2 Toolchain aufsetzen (Mit Upgrade der Schlüssel & Signatur-Bypass)
      - name: Setup MSYS2 & Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          pacman: --noconfirm --disable-download-timeout
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-python3
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pango
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-liblo
            mingw-w64-ucrt-x86_64-taglib
            mingw-w64-ucrt-x86_64-lrdf
            mingw-w64-ucrt-x86_64-lilv
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-dlfcn
            mingw-w64-ucrt-x86_64-jack2

      # 4. ASIO-SDK lokal im Projektordner klonen
      - name: Clone ASIO SDK
        run: |
          git clone https://github.com asiosdk
        shell: bash

      # 5. Konfigurieren
      - name: Configure Ardour
        run: |
          ./waf configure --dist-target=mingw --optimize --windows-vst --with-backends=portaudio,jack,dummy --also-include=asiosdk --internal-shared-libs

      # 6. Kompilieren
      - name: Compile Ardour
        run: |
          ./waf

      # 7. Bereitstellen
      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ardour-Windows-ASIO-JACK
          path: gtk2_ardour/release/
