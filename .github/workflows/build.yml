name: Build Ardour for Windows (ASIO & JACK)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Code auschecken
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      # 2. Abhängigkeiten direkt über das vorinstallierte MSYS2 installieren (ohne Actions-Wrapper)
      - name: Install Toolchain and Dependencies
        shell: cmd
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-python3 mingw-w64-ucrt-x86_64-pkg-config mingw-w64-ucrt-x86_64-glib2 mingw-w64-ucrt-x86_64-pango mingw-w64-ucrt-x86_64-libsndfile mingw-w64-ucrt-x86_64-liblo mingw-w64-ucrt-x86_64-taglib mingw-w64-ucrt-x86_64-lrdf mingw-w64-ucrt-x86_64-lilv mingw-w64-ucrt-x86_64-boost mingw-w64-ucrt-x86_64-dlfcn mingw-w64-ucrt-x86_64-jack2 git make"

      # 3. ASIO-SDK klonen
      - name: Clone ASIO SDK
        shell: cmd
        run: |
          git clone https://github.com asiosdk

      # 4. Konfigurieren über MSYS2 UCRT64 Umgebung
      - name: Configure Ardour
        shell: cmd
        run: |
          C:\msys64\usr\bin\bash.exe -lc "export MSYSTEM=UCRT64 && ./waf configure --dist-target=mingw --optimize --windows-vst --with-backends=portaudio,jack,dummy --also-include=asiosdk --internal-shared-libs"

      # 5. Kompilieren
      - name: Compile Ardour
        shell: cmd
        run: |
          C:\msys64\usr\bin\bash.exe -lc "export MSYSTEM=UCRT64 && ./waf"

      # 6. Bereitstellen
      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ardour-Windows-ASIO-JACK
          path: gtk2_ardour/release/
